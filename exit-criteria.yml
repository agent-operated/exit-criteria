# The checks required before this repository can call a candidate complete.
# This file may run arbitrary commands. Review it before executing it.
version: 1
criteria:
  end_to_end:
    text: The built CLI passes its real end-to-end tests without GTP or a network
    argv: ["node", "--test", "dist/test/e2e/end-to-end.test.js"]

  skill_release:
    text: The standalone Skill bundle passes its release wiring tests without a network
    argv: ["node", "--test", "dist/test/e2e/skill-release.test.js"]

  typecheck:
    text: TypeScript reports no type errors
    argv: ["npm", "run", "typecheck"]

  unit_tests:
    text: All unit tests pass
    argv:
      - node
      - --test
      - dist/test/unit/core-boundary.test.js
      - dist/test/unit/criteria.test.js
      - dist/test/unit/no-model.test.js
      - dist/test/unit/report.test.js
      - dist/test/unit/run-criteria.test.js
      - dist/test/unit/schema.test.js
      - dist/test/unit/unavailable.test.js
