# Real end-to-end fixture: the built CLI executes both commands.
version: 1
criteria:
  command_fails:
    text: A non-zero command is reported as FAIL
    argv: ["node", "-e", "process.exit(3)"]

  command_passes:
    text: A zero-exit command is reported as PASS
    argv: ["node", "-e", "process.exit(0)"]
