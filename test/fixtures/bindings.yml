# Fixture bindings for the end-to-end test.
#
# Deliberately covers three shapes at once: a check that exits 0, a check that
# exits non-zero, and condition ids that are left unbound. Two of the four
# conditions on the issue are intentionally absent here.
#
# The end-to-end test must not bind the real checks, or running it would invoke
# the CLI which would invoke it again.

version: 1
issue: https://github.com/agent-operated/exit-criteria/issues/2

checks:
  end_to_end:
    argv: ["node", "-e", "process.exit(0)"]

  unavailable_is_not_pass:
    argv: ["node", "-e", "process.exit(3)"]
